services:
  db: 
    image: postgres:17
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  migrate:
    build: 
      context: ./backend
      target: migrate
    depends_on:
      - db
  api: 
    build: 
      context: ./backend
      target: api
    depends_on:
      - db 
      - migrate
    ports:
      - "3000:3000"
  frontend:
    build:
      context: ./frontend
    ports:
      - "80:80"
    depends_on:
      - api
volumes:
  postgres_data:
