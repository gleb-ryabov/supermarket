services:
  db: 
    image: postgres:17
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  migrate:
    build: 
      context: ./backend
      target: migrate
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
    depends_on:
      - db
  api: 
    build: 
      context: ./backend
      target: api
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
      LOG_LEVEL: ${LOG_LEVEL}
    depends_on:
      - db 
      - migrate
    ports:
      - "8080:8080"
  frontend:
    build:
      context: ./frontend
    environment:
     API_BASE_URL: http://localhost:8080/api
    ports:
    - "80:80"
    depends_on:
      - api
volumes:
  postgres_data:
